site_name: FreeCAD for Mere Mortals
site_description: Parametric 3D CAD on your own machine. Designing a real part from sketches and numbers in FreeCAD, proving the geometry with arithmetic the program itself must answer to, and exporting files a printer or another CAD program can use, with the limits stated plainly.
